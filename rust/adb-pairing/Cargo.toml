[package]
name = "adb-pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "adb"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
aes-gcm = { version = "0.10", features = ["zeroize"] }
curve25519-dalek = "4"
hkdf = "0.12"
jni = "0.21"
log = "0.4"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

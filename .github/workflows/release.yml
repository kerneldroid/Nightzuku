name: Release

on:
  workflow_dispatch:
    inputs:
      stealth_id:
        description: "Optional fixed stealth application id (manual hotfix builds)"
        required: false
        default: ""
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager/src/main/rust
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Write signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEYSTORE_ALIAS" ] || [ -z "$KEYSTORE_ALIAS_PASSWORD" ]; then
            echo "::error::Signing secrets are not configured; refusing to build an unsigned release."
            exit 1
          fi
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD"
            printf 'KEYSTORE_FILE=../key.jks\n'
          } > signing.properties
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > key.jks
      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "ndk;29.0.14206865"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"
      - name: Configure Gradle
        run: |
          echo 'android.sdk.channel=3' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties
      - name: Build default release APK
        run: ./gradlew :manager:assembleRelease
      - name: Stage default APK
        run: |
          mkdir -p dist
          cp out/apk/*-release.apk "dist/nightzuku-${{ github.ref_name }}-release.apk"
      - name: Generate stealth package id
        env:
          FIXED_STEALTH_ID: ${{ inputs.stealth_id }}
        run: |
          if [ -n "$FIXED_STEALTH_ID" ]; then
            echo "STEALTH_ID=$FIXED_STEALTH_ID" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 - <<'PY' >> "$GITHUB_ENV"
          import random
          import string
          alphabet = string.ascii_lowercase + string.digits
          def segment():
              return random.choice(string.ascii_lowercase) + "".join(
                  random.choice(alphabet) for _ in range(7)
              )
          print(f"STEALTH_ID=com.{segment()}.{segment()}")
          PY
      - name: Build stealth release APK
        run: ./gradlew :manager:assembleRelease -Pnightzuku.applicationId=$STEALTH_ID
      - name: Stage stealth APK
        run: |
          cp out/apk/*-release.apk "dist/nightzuku-${{ github.ref_name }}-stealth-$STEALTH_ID.apk"
      - name: Checkout compatibility stub
        uses: actions/checkout@v7
        with:
          repository: kerneldroid/nightzuku-stub
          path: stub
          ref: main
      - name: Configure stub signing
        run: |
          {
            printf 'KEYSTORE_FILE=../key.jks\n'
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD"
          } > stub/signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
      - name: Build compatibility stub APK
        run: |
          ./stub/gradlew -p stub :app:assembleRelease \
            -Pstub.versionCode=${{ github.run_number }} \
            -Pstub.versionName=${GITHUB_REF_NAME#v}
          cp stub/app/build/outputs/apk/release/app-release.apk "dist/nightzuku-stub-${{ github.ref_name }}.apk"
      - name: Verify APK identities
        run: |
          BT="$ANDROID_HOME/build-tools/37.0.0"
          "$BT/aapt2" dump badging dist/*-release.apk | grep -q "name='kerneldroid.nightzuku'"
          "$BT/aapt2" dump badging dist/*-stealth-*.apk | grep -q "name='$STEALTH_ID'"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml dist/*-stealth-*.apk \
            | grep -q "kerneldroid.nightzuku.manager"
          "$BT/aapt2" dump badging dist/*stub*.apk | grep -q "name='moe.shizuku.privileged.api'"
      - name: Verify signatures
        run: |
          for apk in dist/*.apk; do
            echo "== $apk"
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          done
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: nightzuku-${{ github.ref_name }}-release
          path: dist/*.apk
          compression-level: 9
          overwrite: true
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true

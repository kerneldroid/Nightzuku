plugins {
    id 'com.android.library'
    id 'dev.rikka.tools.refine'
}

android {
    namespace 'moe.shizuku.server'
    buildFeatures {
        buildConfig = false
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.11.0"
    implementation 'com.google.code.gson:gson:2.14.0'
    api 'dev.rikka.rikkax.parcelablelist:parcelablelist:2.0.1'

    implementation project(':aidl')
    implementation project(':common')
    compileOnly project(':provider')
    testImplementation project(':provider')
    implementation project(':shared')
    implementation project(':starter')
    implementation project(':rish')
    implementation project(':server-shared')
    implementation project(':nightdog')
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
    testCompileOnly libs.hidden.stub

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    // API modules ship under kerneldroid.nightzuku; keep the group consistent so
    // @RestrictTo(LIBRARY_GROUP_PREFIX) constants are not reported by lint.
    group = "io.github.kerneldroid"

    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 25
                targetSdk = 37
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

apply from: 'api/manifest.gradle'
def resolveGitCommitId = {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, project.rootDir)
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def out = proc.in.text.trim()
            if (out) return out
        }
    } catch (Throwable ignored) {
    }
    return "nogit"
}
def gitCommitId = resolveGitCommitId()
def gitCommitCount = 60
def baseVersionName = "${api_version_major}.7.1"
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}.r${gitCommitCount}.${gitCommitId}"
}

plugins {
    id 'com.android.library'
}

android {
    namespace 'rikka.rish'
    sourceSets {
        main {
            java.srcDirs = ['../api/rish/src/main/java']
            manifest.srcFile '../api/rish/src/main/AndroidManifest.xml'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    implementation project(':api')

    implementation 'androidx.annotation:annotation:1.3.0'
}

ext.rustPackages = ['rish']
apply from: rootProject.file('gradle/rust-native.gradle')
